server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri/;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;


    location /static/ {
        alias /code/static/;
    }

    location / {
        proxy_pass http://web:8000/;
        proxy_set_header Host $host;
    }
}