server {
    listen 80;
    server_name lacaidaelche.online www.lacaidaelche.online;

    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server { 
    listen 443 ssl; 
    server_name lacaidaelche.online www.lacaidaelche.online; 
 
    ssl_certificate     /etc/letsencrypt/live/lacaidaelche.online/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/lacaidaelche.online/privkey.pem; 
 
    location /static/ { 
        alias /code/static/; 
    } 
 
    location /media/ { 
        alias /code/media/; 
    } 
 
    location / { 
        proxy_pass http://caida_web:8000; 
        proxy_set_header Host $host; 
        proxy_set_header X-Forwarded-Proto http; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
    } 
} 