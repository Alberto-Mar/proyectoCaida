services:
  db:
    image: postgres:15
    container_name: bd-postgres
    ports:
      - "5432:5432"
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    environment:
      - POSTGRES_DB_FILE=/run/secrets/POSTGRES_DB
      - POSTGRES_USER_FILE=/run/secrets/POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/POSTGRES_PASSWORD
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always

  web:
    ports:
      - "8000"
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
      - SECRET_KEY
    volumes:
      - ./pro_caida:/code
    command: sh /code/scripts_docker/dev/web_wait_postgres.sh
    networks:
      - frontend
      - backend
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "82:80"
    volumes:
      - ./pro_caida:/code
      - ./pro_caida/static:/code/static
    networks:
      - frontend
    depends_on:
      - web

volumes:
  postgres_data:

networks:
  frontend:
  backend:

secrets:
  POSTGRES_PASSWORD:
    file: ./secrets/postgres_password.txt
  POSTGRES_USER:
    file: ./secrets/postgres_user.txt
  POSTGRES_DB:
    file: ./secrets/postgres_db.txt
  SECRET_KEY:
    file: ./secrets/secret_key.txt