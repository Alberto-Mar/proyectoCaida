<ul>
    {% for acto in actos %}
    <li>
        <a href="{% url 'acto_update' acto.pk %}" style="text-decoration: none; color: #007bff;">
            {{ acto.nombre }} - {{ acto.fec_inicio }}
        </a>
    </li>
    {% empty %}
    <li>No hay actos</li>
    {% endfor %}
</ul>
<!-- {% for user in usuarios %}
           <p>{{ user.nombre }} - {{ user.edad }}</p> 
        {% empty %}
            No hay usuarios
        {% endfor %} -->

<div class="pagination">
    <span class="step-links">
        {% if actos.has_previous %}
        <a href="?page=1">&laquo; first</a>
        <a href="?page={{ actos.previous_page_number }}">previous</a>
        {% endif %}

        <span class="current">
            Page {{ actos.number }} of {{ actos.paginator.num_pages }}.
        </span>

        {% if actos.has_next %}
        <a href="?page={{ actos.next_page_number }}">next</a>
        <a href="?page={{ actos.paginator.num_pages }}">last &raquo;</a>
        {% endif %}
    </span>
</div>
