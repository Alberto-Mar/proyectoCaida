{% load static %}
{% block header %}
    <header>
        <div class="contenido-header">
            <div class="logo">
                <img src="{% static 'caida/images/logo_caida.png' %}" alt="Caida Logo">
                <span class="texto-logo">Hermandad de La Caida </span>
            </div>
            <nav>
                <a href="#">Inicio</a>
                <a href="#">Contacto</a>
                {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Cerrar Sesión</button>
                </form>
                {% endif %}
            </nav>
        </div>
    </header>
{% endblock %}
