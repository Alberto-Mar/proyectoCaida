{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'caida/css/styles.css' %}">
    <title>Login La Caida</title>
</head>

<body>  
    <div class="contenedor-login">
        <div class="box-login">
            <div class="logo-login">
                <img src="{% static 'caida/images/logo_caida.png' %}" alt="Caida Logo">
            </div>
            <h1 class="titulo-login">LA CAIDA ELCHE</h1>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="Email">Email</label>
                    {{ form.username }}
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary button-full">Iniciar Sesión</button>
            </form>
        </div>
    </div>
    <!-- <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary button-full">Iniciar Sesión</button>
    </form> -->
    {% block footer %} {% include "caida/footer.html" %} {% endblock %}
</body>

</html>
