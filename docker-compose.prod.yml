services:
  web:
    image: albertomarmar/caidaelche:latest
    environment:
      - production
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/prod/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/prod/certs:/etc/nginx/certs
      - ./pro_caida/static:/code/static
      - ./pro_caida/media:/code/media