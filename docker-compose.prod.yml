services:
  web:
    image: albertomarmar/caidaelche:latest
    environment:
      - ENVIRONMENT=production
    command: sh /code/scripts_docker/prod/web_wait_postgres.sh

  nginx:
    ports:
      - "443:443"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - static_data:/code/static
      - media_data:/code/media
      - certs:/etc/letsencrypt
      - certs-data:/data/letsencrypt

  
  migrate_static:
    image: albertomarmar/caidaelche:latest
    environment:
      - ENVIRONMENT=production
      - MIGRATE=yes
    command: sh /code/scripts_docker/prod/web_migrate.sh
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
      - SECRET_KEY
    networks:
      - backend
    deploy:
      mode: replicated-job
      replicas: 1

configs:
  nginx_conf:
    file: ./nginx/prod/nginx.conf

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  
volumes:
  certs:
  certs-data:
  static_data:
  media_data:
    